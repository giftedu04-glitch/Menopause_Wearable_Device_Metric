[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "menopause-wearable"
version = "0.1.0"
description = "At-home wearable sensing + digital-twin platform for modeling the perimenopausal transition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "giftedu04-glitch" }]
keywords = ["menopause", "wearable", "digital-twin", "women-health", "sensors"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "matplotlib>=3.8"]

[project.scripts]
menopause-twin = "menopause_wearable.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
